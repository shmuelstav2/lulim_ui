<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סיכומי מדגרים</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #d4ebaf;
            padding: 20px;
            text-align: center;
        }

        .header img {
            max-height: 80px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin: 0;
        }

        .filter-container {
            display: flex;
            justify-content: flex-start;
            gap: 20px;
            padding: 20px;
            background-color: #f4f4f4;
            border-bottom: 1px solid #ddd;
        }

        .dropdown {
            position: relative;
        }

        /* מחלקה אחידה לכל הכפתורים */
        .uniform-button {
            padding: 10px 15px;
            font-size: 14px;
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
            border-radius: 5px;
            width: 180px;
            text-align: center;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            padding: 10px;
        }

        .dropdown-content label {
            display: block;
            margin: 5px 0;
            font-size: 14px;
        }

        .dropdown-content input {
            margin-right: 5px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .table-wrapper {
            overflow-x: auto;
            margin: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background: #eee;
        }

        th, td {
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .export-btn {
            margin: 20px auto;
            display: block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .export-btn:hover {
            background-color: #45a049;
        }

        #loading {
            text-align: center;
            font-size: 18px;
            padding: 20px;
        }
        .clear-filters-container {
            margin-right: 20px;
        }

        .clear-filters-btn {
            padding: 10px 15px;
            font-size: 14px;
            border: 1px solid #ccc;
            background-color: #f44336;  /* צבע אדום */
            color: white;
            cursor: pointer;
            border-radius: 5px;
            width: 180px;
            text-align: center;
        }

        .clear-filters-btn:hover {
            background-color: #e53935;  /* שינוי צבע ב-hover */
        }

        /* KPI Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .kpi-card {
            background: #fff;
            border-radius: 10px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-top: 4px solid #4CAF50;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .kpi-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 8px;
        }

        .kpi-label {
            font-size: 16px;
            color: #555;
            font-weight: 500;
        }

        @media only screen and (max-width: 991.98px) {
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media only screen and (max-width: 767.98px) {
            .metrics-grid {
                grid-template-columns: 1fr;
                padding: 10px;
            }
            .kpi-value {
                font-size: 26px;
            }
            .kpi-label {
                font-size: 14px;
            }
        }

    </style>
</head>
<body>

<div class="header">
    <img src="new/images/logo.png" alt="Company Logo">
</div>

<div class="main-heading">
    <h1>סיכומי מדגרים</h1>
</div>

<!-- KPI Cards -->
<div class="metrics-grid" id="kpiCards">
    <div class="kpi-card">
        <div class="kpi-value" id="kpi-marketed">-</div>
        <div class="kpi-label">כמות עופות שסווקה</div>
    </div>
    <div class="kpi-card">
        <div class="kpi-value" id="kpi-mortality">-</div>
        <div class="kpi-label">אחוז תמותה ממוצע</div>
    </div>
    <div class="kpi-card">
        <div class="kpi-value" id="kpi-begin-qty">-</div>
        <div class="kpi-label">כמות התחלתית כוללת</div>
    </div>
    <div class="kpi-card">
        <div class="kpi-value" id="kpi-total-weight">-</div>
        <div class="kpi-label">משקל כולל</div>
    </div>
    <div class="kpi-card">
        <div class="kpi-value" id="kpi-marketing-weight">-</div>
        <div class="kpi-label">משקל שיווק ממוצע</div>
    </div>
    <div class="kpi-card">
        <div class="kpi-value" id="kpi-nezilut">-</div>
        <div class="kpi-label">נצילות מזון ממוצעת</div>
    </div>
</div>

<!-- Filters Section -->

<div class="filter-container">
    <div class="clear-filters-container">
        <button class="clear-filters-btn" onclick="clearFilters()">נקה סינונים</button>
    </div>

    <div class="dropdown">
        <button class="uniform-button">שם חווה</button>
        <div class="dropdown-content" id="farmNameFilterGroup"></div>
    </div>
    <div class="dropdown">
        <button class="uniform-button">מספר מדגר</button>
        <div class="dropdown-content" id="flockNumberFilterGroup"></div>
    </div>

    <!--<div class="dropdown">
        <button class="uniform-button">נתונים מלאים</button>
        <div class="dropdown-content" id="statusFilterGroup">
            <label><input type="checkbox" value="closed" checked> מלא</label>
            <label><input type="checkbox" value="open">לא מלא</label>
        </div>
    </div>-->


    <div class="dropdown">
        <button class="uniform-button">תאריך התחלה</button>
        <div class="dropdown-content">
            <label>
                מ: <input type="date" id="startDateFilter" onchange="updateFilters()">
            </label>
            <label>
                עד: <input type="date" id="endDateFilter" onchange="updateFilters()">
            </label>
        </div>
    </div>
    <div class="dropdown">
        <button class="uniform-button">תאריך סיום</button>
        <div class="dropdown-content">
            <label>
                מ: <input type="date" id="startDateEndFilter" onchange="updateFilters()">
            </label>
            <label>
                עד: <input type="date" id="endDateEndFilter" onchange="updateFilters()">
            </label>
        </div>
    </div>
    <div class="dropdown">
        <button class="uniform-button" onclick="exportToExcel()" style="background-color: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">
            יצא לאקסל - סיכומים 2025
        </button>
    </div>

</div>

<!-- Table Section -->
<div class="table-wrapper">
    <div id="loading">Loading data...</div>
    <table id="dataTable" style="display: none;">
        <thead>
        <tr>
            <th>שם חווה</th>
            <th>מספר מדגר</th>
            <th>תאריך התחלה</th>
            <!--<th>סטטוס</th>-->
            <th>תאריך סיום</th>
            <th>כמות התחלתית</th>
            <th>תמותה (14 ימים)</th>
            <th>אחוז תמותה (14 ימים)</th>
            <th>כמות משווקת</th>
            <th>משקל כולל</th>
            <th>משקל שיווק</th>
            <th>משקל משוכן</th>
            <th>נצילות מזון</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
    <!--<button class="export-btn" onclick="exportToExcel()">יצא לאקסל</button>-->
    <!--<button class="export-btn" onclick="transposeTable()">הפוך טבלה</button>-->
</div>

<script>
    function formatDate(dateStr) {
        if (!dateStr) return '';
        const parts = dateStr.split('T')[0].split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}/${parts[1]}/${parts[0].slice(-2)}`;
    }

    function formatNumber(num) {
        if (num == null || isNaN(num)) return '-';
        return Number(num).toLocaleString('he-IL');
    }

    function updateKPIs(data) {
        if (data.length === 0) {
            document.getElementById('kpi-marketed').textContent = '-';
            document.getElementById('kpi-mortality').textContent = '-';
            document.getElementById('kpi-begin-qty').textContent = '-';
            document.getElementById('kpi-total-weight').textContent = '-';
            document.getElementById('kpi-marketing-weight').textContent = '-';
            document.getElementById('kpi-nezilut').textContent = '-';
            return;
        }

        const sumMarketed = data.reduce((acc, item) => acc + (parseFloat(item.marketed_quantity) || 0), 0);
        document.getElementById('kpi-marketed').textContent = formatNumber(sumMarketed);

        const mortalityVals = data.filter(item => item.percent14_tmuta != null).map(item => parseFloat(item.percent14_tmuta));
        const avgMortality = mortalityVals.length > 0 ? (mortalityVals.reduce((a, b) => a + b, 0) / mortalityVals.length) : 0;
        document.getElementById('kpi-mortality').textContent = avgMortality.toFixed(2) + '%';

        const sumBeginQty = data.reduce((acc, item) => acc + (parseFloat(item.begin_quantity) || 0), 0);
        document.getElementById('kpi-begin-qty').textContent = formatNumber(sumBeginQty);

        const sumTotalWeight = data.reduce((acc, item) => acc + (parseFloat(item.total_weight) || 0), 0);
        document.getElementById('kpi-total-weight').textContent = formatNumber(Math.round(sumTotalWeight)) + ' טון';

        const mwVals = data.filter(item => item.marketing_weight != null).map(item => parseFloat(item.marketing_weight));
        const avgMW = mwVals.length > 0 ? (mwVals.reduce((a, b) => a + b, 0) / mwVals.length) : 0;
        document.getElementById('kpi-marketing-weight').textContent = avgMW.toFixed(2) + ' ק״ג';

        const nzVals = data.filter(item => item.nezilut_mazon != null).map(item => parseFloat(item.nezilut_mazon));
        const avgNZ = nzVals.length > 0 ? (nzVals.reduce((a, b) => a + b, 0) / nzVals.length) : 0;
        document.getElementById('kpi-nezilut').textContent = avgNZ.toFixed(2);
    }

    const isLocal = window.location.hostname === 'localhost';
    const baseURL = isLocal ? 'http://localhost:3000' : 'https://fandy.cloud';
    let allData = [];
    let filters = {
        farmNames: [],
        flocks: [],
        startDate: '',
        endDate: ''
    };

    // קריאה ראשונית לכל התהליך
    function beginLoad() {
        fetchData()
            .then(() => {
                startFilters();
            });
    }

    // טעינת המידע מה-API
    async function fetchData() {
        try {
            const response = await fetch(`${baseURL}/api/sikumim`);
            const data = await response.json();
            allData = data; // אין סינון כאן בכלל
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dataTable').style.display = 'table';
        } catch (error) {
            console.error('Error fetching data:', error);
            document.getElementById('loading').textContent = 'Failed to load data.';
        }
    }

    // בניית הפילטרים והגדרת ברירות מחדל
    function startFilters() {
        const farmNames = [...new Set(allData.map(item => item.farm_name))];
        const flocks = [...new Set(allData.map(item => item.new_flock))];

        const farmNameGroup = document.getElementById('farmNameFilterGroup');
        const flockNumberGroup = document.getElementById('flockNumberFilterGroup');

        farmNameGroup.innerHTML = farmNames.map(name => `
        <label><input type="checkbox" value="${name}" checked onchange="updateFilters()"> ${name}</label>
    `).join('');

        flockNumberGroup.innerHTML = flocks.map(flock => `
        <label><input type="checkbox" value="${flock}" checked onchange="updateFilters()"> ${flock}</label>
    `).join('');

        // תאריך ברירת מחדל
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDateFilter').value = '2025-01-01';
        document.getElementById('endDateFilter').value = today;

        filters.startDate = '2025-01-01';
        filters.endDate = today;

        updateFilters();
    }

    // עדכון משתנה הפילטרים והפעלת בניית הטבלה מחדש
    function updateFilters() {
        filters.farmNames = Array.from(document.querySelectorAll('#farmNameFilterGroup input:checked')).map(input => input.value);
        filters.flocks = Array.from(document.querySelectorAll('#flockNumberFilterGroup input:checked')).map(input => input.value);
        filters.startDate = document.getElementById('startDateFilter').value;
        filters.endDate = document.getElementById('endDateFilter').value;

        console.log('📝 Filters updated:', filters);

        makeTable();
    }

    // יצירת הטבלה על פי הפילטרים
    function makeTable() {
        const filteredData = allData.filter(item => {
            const matchesFarm = filters.farmNames.length === 0 || filters.farmNames.includes(item.farm_name);
            const matchesFlock = filters.flocks.length === 0 || filters.flocks.includes(String(item.new_flock));
            const beginDate = new Date(item.begin_date);
            const matchesDate = (!filters.startDate || beginDate >= new Date(filters.startDate)) &&
                (!filters.endDate || beginDate <= new Date(filters.endDate));

            return matchesFarm && matchesFlock && matchesDate;
        });

        updateKPIs(filteredData);
        populateTable(filteredData);
        transposeTable();
    }

    // הצגת הטבלה ב-DOM
    function populateTable(data) {
        console.log("➡️ populateTable() called");
        console.log("📦 Data received:", data);

        const tableWrapper = document.querySelector('.table-wrapper');
        console.log("📦 tableWrapper found:", tableWrapper);

        if (!tableWrapper) {
            console.error("❌ .table-wrapper div not found in DOM!");
            return;
        }

        const oldTable = document.getElementById('dataTable');
        console.log("📦 Existing table found:", oldTable);

        if (oldTable) {
            console.log("🗑️ Removing existing table from DOM");
            oldTable.remove();
        }

        const table = document.createElement('table');
        table.id = 'dataTable';
        table.style.display = 'none';
        console.log("🆕 Created new table element:", table);

        const thead = document.createElement('thead');
        thead.innerHTML = `
    <tr>
      <th>שם חווה</th>
      <th>מספר מדגר</th>
      <th>תאריך התחלה</th>
      <th>תאריך סיום</th>
      <th>כמות התחלתית</th>
      <th>תמותה (14 ימים)</th>
      <th>אחוז תמותה (14 ימים)</th>
      <th>כמות משווקת</th>
      <th>משקל כולל</th>
      <th>משקל שיווק</th>
      <th>משקל משוכן</th>
      <th>נצילות מזון</th>
    </tr>
  `;
        table.appendChild(thead);
        console.log("✅ Added table head");

        const tbody = document.createElement('tbody');
        table.appendChild(tbody);
        console.log("✅ Added empty table body");

        tableWrapper.appendChild(table);
        console.log("📥 Appended new table to tableWrapper");

        if (data.length === 0) {
            console.warn("⚠️ No data to display — showing loading message");
            document.getElementById('loading').innerText = 'אין נתונים להצגה';
            table.style.display = 'none';
            return;
        }

        console.log(`📊 Populating table with ${data.length} rows`);

        data.forEach((item, index) => {
            console.log(`📝 Inserting row ${index + 1}:`, item);

            const row = document.createElement('tr');
            row.innerHTML = `
      <td>${item.farm_name}</td>
      <td>${item.new_flock}</td>
      <td>${formatDate(item.begin_date)}</td>
      <td>${item.end_date ? formatDate(item.end_date) : 'N/A'}</td>
      <td>${item.begin_quantity}</td>
      <td>${item.mortality14}</td>
      <td>${item.percent14_tmuta != null ? parseFloat(item.percent14_tmuta).toFixed(2) + '%' : 'N/A'}</td>
      <td>${item.marketed_quantity || 'N/A'}</td>
      <td>${item.total_weight || 'N/A'}</td>
      <td>${item.marketing_weight || 'N/A'}</td>
      <td>${item.mesukan_weight || 'N/A'}</td>
      <td>${item.nezilut_mazon || 'N/A'}</td>
    `;
            tbody.appendChild(row);
        });

        console.log("✅ Finished adding all rows");

        table.style.display = 'table';
        console.log("🎉 Table display set to visible");
    }


    // היפוך הטבלה (כמו שביקשת)
    function transposeTable() {
        const table = document.getElementById("dataTable");
        const rows = Array.from(table.rows);
        if (rows.length === 0) return;

        const transposed = [];

        for (let i = 0; i < rows[0].cells.length; i++) {
            const newRow = [];
            for (let j = 0; j < rows.length; j++) {
                newRow.push(rows[j].cells[i].innerHTML);
            }
            transposed.push(newRow);
        }

        table.innerHTML = "";
        transposed.forEach(row => {
            const tr = document.createElement('tr');
            row.forEach(cell => {
                const td = document.createElement('td');
                td.innerHTML = cell;
                tr.appendChild(td);
            });
            table.appendChild(tr);
        });
    }

    // איפוס כל הפילטרים
    function clearFilters() {
        document.querySelectorAll('.filter-container input[type="checkbox"]').forEach(checkbox => {
            checkbox.checked = true;
        });

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDateFilter').value = '2025-01-01';
        document.getElementById('endDateFilter').value = today;

        updateFilters();
    }

    // טעינה ראשונית

    async function exportToExcel() {
        try {
            const response = await fetch(`${baseURL}/api/excel`);
            if (!response.ok) throw new Error('Network response was not ok.');

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'report.xlsx';
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);

            console.log('Excel file downloaded');
        } catch (error) {
            console.error('Error exporting Excel:', error);
        }
    }




    window.onload = beginLoad;
</script>
</body>
</html>
